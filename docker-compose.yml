# Keep published ports loopback-only; see docs/human-in-the-loop.md Section 7.
services:
  api:
    build:
      context: .
    image: repopilot
    command:
      - uvicorn
      - app.api.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  console:
    image: repopilot
    command:
      - streamlit
      - run
      - app/console/app.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      REPOPILOT_API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  # PostgreSQL is deferred until storage supports configurable database URLs.
  # MCP uses stdio and is launched separately: docker run -i repopilot repopilot-mcp
